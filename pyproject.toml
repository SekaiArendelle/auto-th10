[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "auto-th10"
version = "0.1.0"
description = "Windows interface and Python environment for Touhou 10 automation experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.optional-dependencies]
train = ["gymnasium>=1.0", "numpy>=2.0", "torch>=2.0"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/auto_th10"]
