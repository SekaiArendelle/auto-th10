[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "auto-th10"
version = "0.1.0"
description = "Windows interface and Python environment for Touhou 10 automation experiments"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

[project.optional-dependencies]
train = ["gymnasium>=1.0", "numpy>=2.3.2", "torch>=2.9"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-G", "Ninja"]
build-dir = "build/python-ninja/{wheel_tag}"
editable.rebuild = true
wheel.packages = ["python/auto_th10"]
