[workspace]
name = "auto-th10"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.14.*"
cmake = ">=4.2,<5"
ninja = ">=1.13,<2"
gcc_win-64 = ">=15,<17"
scikit-build-core = ">=0.10,<1"

[pypi-dependencies]
auto-th10 = { path = ".", editable = true }

[tasks]
configure = "cmake --preset dev --fresh"
build = { cmd = "cmake --build --preset dev", depends-on = ["configure"] }
test-c = { cmd = "ctest --preset dev", depends-on = ["build"] }
# Run `pixi run build` first; trailing arguments are appended, e.g. `pixi run ctl snapshot`.
ctl = "build/dev/th10ctl.exe"
configure-release = "cmake --preset release --fresh"
build-release = { cmd = "cmake --build --preset release", depends-on = ["configure-release"] }
test-python = "python -m unittest discover -s tests/python -v"
test = { depends-on = ["test-c", "test-python", "test-training"] }

[feature.training-tests.pypi-dependencies]
gymnasium = ">=1.0"
numpy = ">=2.0"

[feature.training-tests.tasks]
test-training = "python -m unittest discover -s tests/python -p \"test_rl_*.py\" -v"

[environments]
default = { features = [], solve-group = "default" }
training-tests = { features = ["training-tests"], solve-group = "default" }
